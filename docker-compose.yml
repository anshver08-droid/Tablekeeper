services:
  postgres:
    # Development-only database, bound to loopback; set credentials in .env.
    image: postgres:16.14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tablekeeper}
      POSTGRES_USER: ${POSTGRES_USER:-tablekeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the environment}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - tablekeeper-postgres:/var/lib/postgresql/data
volumes:
  tablekeeper-postgres:
